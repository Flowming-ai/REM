[project]
name = "energy-recovery-experiments"
version = "0.1.0"
description = "Reproducible counterfactual recovery-cost experiments after poisoned energy-agent decisions"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "pandas>=2.2,<3",
  "matplotlib>=3.9,<4",
  "pandapower>=3.0,<4",
  "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
